# =============================================================================
# GPS SQL Data Flow Visualizer
#
# Single backend serving pre-built frontend from backend/app/static/
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: gps-sql-visualizer:dev
    container_name: gps-sql-backend
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/tests:/app/backend/tests
      - ./samples:/app/samples
      - ./VERSION:/app/VERSION
      - backend_cache:/app/backend/analysis_cache
      - workspace_data:/tmp/workspaces
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEBUG=${DEBUG:-true}
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  backend_cache:
  workspace_data:
